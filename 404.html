<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>רדאר מנויים</title>
    <script>
      // GitHub Pages: קישור ישיר (למשל ‎/decide/123‎ מהמייל) מגיע לכאן.
      // מעבירים לאפליקציה עם הכתובת המקורית בפרמטר, והאפליקציה משחזרת אותה (src/lib/spaRedirect.ts).
      // מבוסס על spa-github-pages (MIT).
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
